<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">معماری State Machine دستیار هوشمند فارسی</title><desc id="d">جریان پیام کاربر تا ثبت کنترل‌شده داده</desc>
  <rect width="1200" height="675" fill="#07152f"/><text x="1100" y="85" text-anchor="end" direction="rtl" font-family="Tahoma,Arial" font-size="34" fill="#fff">از گفت‌وگو تا اثر جانبی کنترل‌شده</text>
  <g font-family="Tahoma,Arial" font-size="22" text-anchor="middle"><g fill="#102b5d" stroke="#3b82f6" stroke-width="3"><rect x="55" y="245" width="180" height="100" rx="18"/><rect x="285" y="245" width="180" height="100" rx="18"/><rect x="515" y="245" width="180" height="100" rx="18"/><rect x="745" y="245" width="180" height="100" rx="18"/><rect x="975" y="245" width="180" height="100" rx="18"/></g><g fill="#eaf2ff"><text x="145" y="305">پیام کاربر</text><text x="375" y="285">پیشنهاد مدل</text><text x="375" y="320">بدون اثر جانبی</text><text x="605" y="285">Draft نسخه‌دار</text><text x="605" y="320">و اعتبارسنجی</text><text x="835" y="285">مرور و تأیید</text><text x="835" y="320">نسخه جاری</text><text x="1065" y="285">ثبت idempotent</text><text x="1065" y="320">در مقصد</text></g></g>
  <g stroke="#60a5fa" stroke-width="5" fill="none"><path d="M235 295h50"/><path d="M465 295h50"/><path d="M695 295h50"/><path d="M925 295h50"/></g><text x="600" y="465" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial" font-size="24" fill="#93c5fd">قانون اصلی: مدل پیشنهاد می‌دهد؛ کد قطعی state و مجوز عملیات را نگه می‌دارد.</text>
</svg>
