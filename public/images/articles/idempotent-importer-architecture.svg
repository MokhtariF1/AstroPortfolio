<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">معماری Importer پایدار</title><desc id="d">payload منجمد، صف PostgreSQL، ارسال idempotent و reconciliation</desc><rect width="1200" height="675" fill="#07152f"/><text x="1100" y="82" text-anchor="end" direction="rtl" font-family="Tahoma,Arial" font-size="34" fill="#fff">Importer پایدار و Idempotent</text><g font-family="Tahoma,Arial" font-size="20" text-anchor="middle"><g fill="#102b5d" stroke="#3b82f6" stroke-width="3"><rect x="55" y="225" width="200" height="110" rx="18"/><rect x="280" y="225" width="200" height="110" rx="18"/><rect x="505" y="225" width="200" height="110" rx="18"/><rect x="730" y="225" width="200" height="110" rx="18"/><rect x="955" y="225" width="200" height="110" rx="18"/></g><g fill="#eaf2ff"><text x="155" y="275">Frozen Payload</text><text x="155" y="308">و Hash</text><text x="380" y="275">PostgreSQL</text><text x="380" y="308">SKIP LOCKED</text><text x="605" y="275">Attempt با کلید</text><text x="605" y="308">Idempotency</text><text x="830" y="275">مقصد خارجی</text><text x="830" y="308">و شناسه نتیجه</text><text x="1055" y="275">Reconciliation</text><text x="1055" y="308">نتیجه نامشخص</text></g></g><g stroke="#60a5fa" stroke-width="5"><path d="M255 280h25"/><path d="M480 280h25"/><path d="M705 280h25"/><path d="M930 280h25"/></g><text x="600" y="455" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial" font-size="24" fill="#93c5fd">Timeout شکست قطعی نیست؛ ابتدا نتیجه عملیات اثبات می‌شود.</text></svg>
