# Bootstrap HTTP and keep this ACME location in the final HTTPS configuration.
server {
    listen 80;
    listen [::]:80;
    server_name hosseinmokhtari.ir www.hosseinmokhtari.ir;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hosseinmokhtari.ir/acme;
        default_type text/plain;
    }

    location / {
        return 404;
    }
}
