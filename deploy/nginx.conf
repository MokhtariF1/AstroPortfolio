server {
    listen 80;
    listen [::]:80;
    server_name hosseinmokhtari.ir www.hosseinmokhtari.ir;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hosseinmokhtari.ir/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://hosseinmokhtari.ir$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.hosseinmokhtari.ir;
    ssl_certificate /etc/letsencrypt/live/hosseinmokhtari.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hosseinmokhtari.ir/privkey.pem;
    return 301 https://hosseinmokhtari.ir$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hosseinmokhtari.ir;
    ssl_certificate /etc/letsencrypt/live/hosseinmokhtari.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hosseinmokhtari.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/hosseinmokhtari.ir/current;
    index index.html;
    charset utf-8;
    autoindex off;
    error_page 404 /404.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    location ~ /\. {
        return 404;
    }

    location /_astro/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/hosseinmokhtari-access.log;
    error_log /var/log/nginx/hosseinmokhtari-error.log;
}
